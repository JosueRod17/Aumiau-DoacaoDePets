<div class="pet-field{% if field.errors %} pet-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
    <div class="pet-errors" id="{{ field.auto_id }}_error" data-field-errors="{{ field.name }}">{{ field.errors }}</div>
</div>
